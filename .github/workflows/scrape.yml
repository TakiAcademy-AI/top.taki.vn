name: Quét dữ liệu mỗi 30 phút
on:
  schedule:
    - cron: '*/30 * * * *'   # mỗi 30 phút (giờ UTC; GitHub có thể trễ 5-15p)
    # Quét CHỐT cuối cuộc đua "MINH TRÍ 30 NGÀY" (kết thúc 23:59 ngày 10/10 giờ VN = 16:59 UTC).
    # Đặt 2 mốc sát giờ để có lần chấm điểm cuối gần 23:59 nhất mà không lố qua 0h (chấm điểm dừng từ 11/10).
    - cron: '45 16 10 10 *'  # 23:45 VN 10/10 (an toàn, gần như chắc chắn trước nửa đêm)
    - cron: '53 16 10 10 *'  # 23:53 VN 10/10 (sát 23:59 nhất)
  workflow_dispatch: {}        # cho phép bấm chạy tay
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Quét kênh + tính điểm (gọi thẳng server production, bỏ Cloudflare)
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          HOST_IP: "51.79.229.121"
        run: |
          set -e
          echo "== Quét =="
          curl -sk --resolve top.taki.vn:443:$HOST_IP --max-time 280 \
            "https://top.taki.vn/api/cron/daily-scrape?secret=$CRON_SECRET" || echo "scrape timeout (server vẫn chạy nền)"
          echo "== Tính điểm =="
          curl -sk --resolve top.taki.vn:443:$HOST_IP --max-time 120 \
            "https://top.taki.vn/api/cron/daily-scoring?secret=$CRON_SECRET" || echo "scoring lỗi"
          echo "== Curl reels ẩn danh (tự gate theo giờ, bắt reel viral extension sót) =="
          curl -sk --resolve top.taki.vn:443:$HOST_IP --max-time 290 \
            "https://top.taki.vn/api/cron/reels-curl?secret=$CRON_SECRET" || echo "reels-curl timeout (server vẫn chạy nền)"
          echo "== Graph API (kênh có token học viên cấp - nguồn chính thống) =="
          curl -sk --resolve top.taki.vn:443:$HOST_IP --max-time 290 \
            "https://top.taki.vn/api/cron/graph-scrape?secret=$CRON_SECRET" || echo "graph-scrape timeout (server vẫn chạy nền)"
